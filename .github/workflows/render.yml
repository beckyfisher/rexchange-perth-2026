name: Render talk

# Builds the figures and the deck on every push, and uploads the result as an
# artifact. Deliberately does NOT publish to GitHub Pages: the repository is
# private and the talk is not public until after the event.
#
# To publish later: make the repo public, then swap the upload-artifact step for
# quarto-dev/quarto-actions/publish@v2 with `target: gh-pages`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # No DESCRIPTION in this repo (it is a talk, not a package), so the figure
      # dependencies are listed explicitly. Keep in sync with the library() block
      # at the top of R/figures.R.
      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ggplot2
            any::dplyr
            any::tidyr
            any::tibble
            any::forcats
            any::scales
            any::patchwork
            any::ssdtools
            any::ssddata

      # NOTE: R/git-evidence.R, R/git-evidence-periods.R and
      # R/bayesnec-evidence.R are deliberately NOT run here. They clone
      # repositories (the last also reads the GitHub API through an
      # authenticated gh), and their output changes as those repos gain
      # commits, which would make the staleness check below fail for reasons
      # unrelated to this repo. Regenerate data/*.csv by hand when you want
      # fresher numbers.

      # Proves the figure script runs. Its PNGs are not compared with the
      # committed ones: the same code renders different bytes on Ubuntu and on
      # the author's Windows machine (fonts, anti-aliasing), so a byte check on
      # talk/figures failed on every push regardless of whether anything changed.
      - name: Build figures
        run: Rscript R/figures.R

      # The AIMS template assets are not in the repository (CLAUDE.md §4). With
      # no source deck present, this writes labelled placeholders so the deck
      # still renders; it needs base R only.
      - name: Write placeholder AIMS assets
        run: Rscript R/aims-assets.R

      # Likewise the pictures from the speaker's earlier slides (talk/local/).
      - name: Write placeholder local pictures
        run: Rscript R/local-images.R

      - name: Rebuild speaker notes from the deck
        run: Rscript R/build-speaker-notes.R

      - name: Fail if the speaker notes are stale
        run: |
          if [ -n "$(git status --porcelain notes/speaker-notes.md)" ]; then
            echo "::error::notes/speaker-notes.md is out of date. Run 'Rscript R/build-speaker-notes.R' and commit the result."
            git --no-pager diff --stat notes/speaker-notes.md
            exit 1
          fi

      - name: Render
        run: quarto render

      - name: Upload rendered talk
        uses: actions/upload-artifact@v4
        with:
          name: talk
          path: _output/
          retention-days: 30
