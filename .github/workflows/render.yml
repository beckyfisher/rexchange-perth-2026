name: Render talk

# Builds the figures and the deck on every push, and uploads the result as an
# artifact. Deliberately does NOT publish to GitHub Pages: the repository is
# private and the talk is not public until after the event.
#
# To publish later: make the repo public, then swap the upload-artifact step for
# quarto-dev/quarto-actions/publish@v2 with `target: gh-pages`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # No DESCRIPTION in this repo (it is a talk, not a package), so the figure
      # dependencies are listed explicitly. Keep in sync with the library() block
      # at the top of R/figures.R.
      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ggplot2
            any::dplyr
            any::tidyr
            any::tibble
            any::forcats
            any::scales
            any::patchwork
            any::ssdtools
            any::ssddata

      - name: Build figures
        run: Rscript R/figures.R

      - name: Rebuild speaker notes from the deck
        run: Rscript R/build-speaker-notes.R

      - name: Fail if generated files are stale
        run: |
          if [ -n "$(git status --porcelain talk/figures notes/speaker-notes.md)" ]; then
            echo "::error::Generated files are out of date. Run 'Rscript R/figures.R' and 'Rscript R/build-speaker-notes.R', then commit the result."
            git --no-pager diff --stat talk/figures notes/speaker-notes.md
            exit 1
          fi

      - name: Render
        run: quarto render

      - name: Upload rendered talk
        uses: actions/upload-artifact@v4
        with:
          name: talk
          path: _output/
          retention-days: 30
